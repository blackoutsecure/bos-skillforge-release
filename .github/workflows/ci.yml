name: Public release contracts

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline public-only archive and release contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/validate_public_release.py scripts/container_release.py
          git diff --check
